<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Three Calculators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
/*
VOICE: quiet desk-at-night; the three machines are the whole page, nothing competes.
IDEA: a drawer of calculators you flip through, one per swipe.
PICTURE: each calculator, full height, drawn in CSS with working keys and live LCDs.
COLOUR and TYPE: graphite ground; slate, charcoal and ink-blue bodies; amber shift, rose alpha legends; Barlow Semi Condensed legends, DotGothic16 for the dot-matrix LCDs.
LAYOUT: thin tab bar on top, swipe track below, each machine scaled to fit the screen.
*/
:root{color-scheme:light dark;--bg:light-dark(#d8d5ce,#101215);--ink:light-dark(#1c1d20,#e9e7e2);--mute:light-dark(#5c5a55,#8d8f94);--tab:light-dark(#c9c5bc,#1b1e23);--acc:#e8a33a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Barlow Semi Condensed",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.nav{position:fixed;inset:0 0 auto 0;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:flex;align-items:center;gap:6px;z-index:5}
.nav button{flex:1;min-height:36px;border:0;border-radius:18px;background:transparent;color:var(--mute);font:600 15px "Barlow Semi Condensed",sans-serif;cursor:pointer}
.nav button.on{background:var(--tab);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--acc)}
.track{position:fixed;inset:calc(48px + env(safe-area-inset-top)) 0 0 0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;justify-content:center;align-items:flex-start;padding:4px 0 calc(8px + env(safe-area-inset-bottom));overflow:hidden}
.scaler{transform-origin:top center}
.dots{position:fixed;bottom:calc(3px + env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:center;gap:6px;pointer-events:none}

/* ---------- calculator bodies ---------- */
.body{width:340px;border-radius:26px 26px 34px 34px;padding:14px 0 6px;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 -3px 0 rgba(0,0,0,.35) inset,0 18px 40px rgba(0,0,0,.45);
  --keyb:#2a2d33;--keyt:#f2f2f2;--numb:#cfd0cc;--numt:#1b1b1b;--dlb:#d2603e;--sh:#e8a33a;--al:#ec6b7a}
.ms{background:linear-gradient(#3b4049,#2a2e35 18%,#23262c);--keyb:#1d2026;--numb:#d6d3cb;--dlb:#d2603e}
.es{background:linear-gradient(#4a4f57,#2f3339 20%,#26292e);--keyb:#16181c;--numb:#e3e4e1;--dlb:#2f7fc4;--sh:#e7b84a}
.cg{background:linear-gradient(#24324a,#161c27 22%,#12161d);--keyb:#0c0f14;--numb:#f4f4f2;--dlb:#3b4452;--sh:#f0c24b}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 22px 8px;color:#c9ccd2}
.bn{font:700 15px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.02em}
.bt{font:500 11px "Barlow Semi Condensed",system-ui,sans-serif;opacity:.7}
.solar{margin-left:auto;display:flex;gap:2px;padding:3px;background:#2b1f1a;border-radius:3px;align-self:center}
.solar i{width:14px;height:12px;background:linear-gradient(135deg,#5a3a2c,#3a241b);border-radius:1px}
.lcdwrap{margin:0 16px;padding:10px;border-radius:12px;background:linear-gradient(#1a1c20,#2b2e34);box-shadow:0 1px 0 rgba(255,255,255,.08),0 2px 6px rgba(0,0,0,.5) inset}
.lcd{border-radius:4px;color:#1f2420;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset,0 6px 10px -6px rgba(0,0,0,.35) inset}
.ind{display:flex;gap:4px;font:9px/1 "DotGothic16",monospace;padding:3px 5px 0;height:13px;white-space:nowrap;overflow:hidden}
.ind span{opacity:.07}.ind span.on{opacity:.9}

/* two-line LCD */
.mslcd{background:linear-gradient(#b7c1a6,#a9b597);height:104px}
.l1{position:relative;display:flex;padding:4px 6px 0;height:32px;font:23px/28px "DotGothic16",monospace}
.l1 b{font-weight:400;width:21px;text-align:center;flex:none;position:relative}
.l1 b.cu::after{content:"";position:absolute;left:2px;right:2px;bottom:0;height:2px;background:#1f2420;animation:blink 1s steps(1) infinite}
.l1 b.ci::before{content:"";position:absolute;left:-1px;top:2px;bottom:2px;width:2px;background:#1f2420;animation:blink 1s steps(1) infinite}
.l1 .arr{position:absolute;top:-12px;font-size:9px;font-style:normal}.arr.l{left:150px}.arr.r{right:6px}
.l2{height:56px;padding:3px 4px 5px 6px;display:flex;justify-content:flex-end}
.l2 svg{height:100%;width:100%}
.l2 .on{fill:#1f2420}.l2 .off{fill:#1f2420;opacity:.06}.l2 .x10{font:600 6.4px "Barlow Semi Condensed",sans-serif;fill:#1f2420}
.l2.dim svg{opacity:.0}
.mrow{display:flex;justify-content:space-around;width:100%}
.mrow span{flex:1;text-align:center}
.mrow.num span svg{height:34px;width:auto}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){i.cur,.l1 b::after,.l1 b::before{animation:none!important}}

/* natural display LCD */
.eslcd{background:linear-gradient(#c9d0c2,#b9c1b1);height:104px;font-family:"DotGothic16",monospace}
.eslcd .scr{position:relative;height:89px;padding:0 6px}
.eslcd .in{height:46px;display:flex;align-items:center;overflow:hidden;font-size:17px}
.eslcd .in.sm{height:30px}
.inner{position:relative;white-space:nowrap;display:flex;align-items:center}
.eslcd .out{height:43px;display:flex;align-items:center;justify-content:flex-end;font-size:21px;white-space:nowrap;overflow:hidden;gap:1px;padding:0 5px 3px 0;line-height:1.15}
.eslcd .out .sm{font-size:14px}
.blab{margin-right:auto;font-size:12px}
.menu{padding-top:4px;font-size:14px;line-height:21px}
.menu .mr{display:flex}.menu .mr span{flex:1;white-space:nowrap}
.menu.msg .mr span{text-align:center}
.pgarrow{position:absolute;right:6px;bottom:2px;font-size:10px}
.grid{width:100%;border-collapse:collapse;font-size:13px;margin-top:1px;table-layout:fixed}
.grid th{font-weight:400;text-align:center;border-bottom:1px solid #1f2420;height:16px}
.grid td{text-align:right;padding:0 4px;height:17px;border-left:1px solid rgba(31,36,32,.5);white-space:nowrap;overflow:hidden}
.grid td.rn{width:22px;border-left:0;text-align:left;font-size:10px}
.grid th:first-child{width:22px}
.grid td.sel{background:#1f2420;color:#c3cabb}
.gbot{position:absolute;right:6px;bottom:2px;left:6px;text-align:right;font-size:15px;white-space:nowrap;overflow:hidden;display:flex;justify-content:flex-end;align-items:center}
.eqr{display:flex;flex-direction:column;height:86px}
.eqr .lab{font-size:16px;padding-top:6px}
.eqr .out{height:50px;font-size:21px;padding:0 5px 3px 0}
.sres div{display:flex;justify-content:space-between;font-size:16px;height:28px;align-items:center}

/* natural math typesetting (shared) */
.ch{white-space:pre}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.82em;line-height:1.08}
.fr>.nu{border-bottom:1.5px solid currentColor;padding:0 2px 1px}
.fr>.de{padding:1px 2px 0}
.fr>span{display:flex;align-items:center;justify-content:center}
.rt{display:inline-flex;align-items:stretch}
.rs{padding-right:1px}
.rb{border-top:1.5px solid currentColor;padding:1px 2px 0;display:inline-flex;align-items:center}
.ri{font-size:.55em;margin-right:-4px}
sup.sp{font-size:.66em;vertical-align:.6em;display:inline-flex;align-items:center}
sub.sb{font-size:.62em;vertical-align:-.35em;display:inline-flex;align-items:center}
.ab{border-left:1.5px solid;border-right:1.5px solid;padding:0 2px;display:inline-flex;align-items:center;margin:0 1px}
.big{display:inline-flex;align-items:center}
.bs{font-size:1.4em;line-height:1}
.lim{display:inline-flex;flex-direction:column;font-size:.55em;order:2;margin-left:-2px;line-height:1.5}
.lim2{display:inline-flex;flex-direction:column;align-items:center;font-size:.55em;line-height:1.05}
.lim2 .bs{font-size:2.4em;line-height:.9}
.box{display:inline-flex;align-items:center;min-width:.6em;height:.95em;border:1px dotted currentColor;vertical-align:middle}
i.cur{display:inline-block;width:2px;height:1.1em;background:currentColor;vertical-align:middle;animation:blink 1s steps(1) infinite;margin:0 -1px;flex:none}
.box i.cur{height:.8em;margin:0 auto}

/* colour graphing screen */
.cgw{padding:9px}
.cgscr{width:100%;aspect-ratio:384/216;background:#fff;border-radius:3px;position:relative;overflow:hidden;color:#111;font:12px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.sbar{height:13px;flex:none;background:linear-gradient(#e7ecf3,#cfd8e4);display:flex;align-items:center;gap:6px;padding:0 4px;font-size:8.5px;color:#334;white-space:nowrap;overflow:hidden}
.sbar .si{width:10px;height:10px;display:grid;place-items:center;border-radius:2px;color:transparent;font-weight:700}
.sbar .si.on{background:#e6a817;color:#fff}.sbar .si.al.on{background:#d63a4a}
.bat{margin-left:auto;width:16px;height:8px;border:1px solid #334;border-radius:1px;position:relative;padding:1px}.bat i{display:block;height:100%;width:80%;background:#2a9d48}
.main{flex:1;position:relative;overflow:hidden}
.fbar{height:16px;flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:1px 2px 2px}
.fbar span{background:linear-gradient(#3c4b63,#1f2a3a);color:#fff;font-size:9px;font-weight:600;display:grid;place-items:center;border-radius:2px 2px 6px 6px;white-space:nowrap;overflow:hidden}
.fbar span.e{background:transparent}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2px;padding:8px 6px 0}
.ic{display:flex;flex-direction:column;align-items:center;position:relative;padding:3px 0 2px;border-radius:4px;border:2px solid transparent}
.ic.sel{border-color:#e6a817;background:#fff7df}
.ic svg{width:38px;height:38px}
.ic .ik{position:absolute;top:1px;left:6px;font-size:8px;font-weight:700;color:#fff;background:#0008;border-radius:2px;padding:0 2px}
.ic .in{font-size:8.5px;margin-top:2px;white-space:nowrap}
.run{position:absolute;inset:0;overflow:hidden;padding:2px 5px}
.runlist{display:flex;flex-direction:column;justify-content:flex-end;min-height:100%}
.rin{display:flex;align-items:center;min-height:17px;white-space:nowrap}
.rout{display:flex;justify-content:flex-end;align-items:center;min-height:17px;white-space:nowrap;border-bottom:1px solid #eef}
.cgtitle{font-size:10px;padding:2px 5px;background:#eef2f8;border-bottom:1px solid #d5dce8}
.flist{padding:1px 4px}
.fr2{display:flex;align-items:center;gap:3px;min-height:18px;white-space:nowrap;overflow:hidden;border-radius:2px}
.fr2.cur{background:#dce8ff}
.sw{width:4px;height:12px;border-radius:1px;flex:none}
.yl{font-size:11px}.eqs{padding:0 2px;border-radius:2px}.eqs.on{background:#1f2a3a;color:#fff}
.fx{display:flex;align-items:center}
.gc{position:absolute;inset:0;width:100%;height:100%}
.gover{position:absolute;inset:0;pointer-events:none}
.gt{position:absolute;left:4px;top:2px;font-size:10.5px;background:#fffd;padding:0 3px;display:flex;align-items:center;border-radius:2px}
.gb{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;padding:1px 5px;font-size:10.5px;background:#fffe;border-top:1px solid #ccd}
.form,.setup{padding:2px 6px}
.frm{display:flex;justify-content:space-between;min-height:17px;align-items:center;padding:0 3px;border-radius:2px;font-size:11.5px}
.frm span:last-child{display:flex;align-items:center}
.frm.cur{background:#1f2a3a;color:#fff}
.ctbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.ctbl th{background:#eef2f8;font-weight:600;font-size:10px;height:14px}
.ctbl td{text-align:right;padding:0 3px;height:15px;border:1px solid #e3e7ee;white-space:nowrap;overflow:hidden}
.ctbl td.sel{background:#1f2a3a;color:#fff}
.ctbl td.rn,.ctbl th:first-child{width:18px;text-align:center;font-size:9px;background:#f6f8fb}
.ctbl.st th.hc{background:#ffe9a8}
.cbot{position:absolute;left:0;right:0;bottom:0;text-align:right;padding:1px 6px;font-size:12px;border-top:1px solid #d5dce8;background:#fff;display:flex;justify-content:flex-end;align-items:center;min-height:17px}
.elist{padding:4px 8px;font-size:12px}
.elist>div{min-height:18px;display:flex;align-items:center}
.elist.res>div,.res2{display:flex;justify-content:space-between}
.hint{color:#667;font-size:10.5px}
.popup{position:absolute;left:14%;right:14%;top:26%;background:#fff;border:2px solid #1f2a3a;border-radius:4px;padding:8px;text-align:center;font-size:13px;box-shadow:0 4px 12px #0003}
.popup .pk2{font-size:10px;color:#556;margin-top:4px}

/* ---------- keys ---------- */
.kb{padding:8px 14px 10px}
.topgrid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto auto;gap:2px 8px;margin-top:4px}
.krow{display:grid;gap:2px 8px;margin-top:3px}
.f6{grid-template-columns:repeat(6,minmax(0,1fr))}
.f5{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 10px}
.numblock{margin-top:8px;padding-top:4px}
.kw{display:flex;flex-direction:column}
.kl{display:flex;justify-content:space-between;align-items:flex-end;height:13px;font:600 8.5px/1 "Barlow Semi Condensed",sans-serif;padding:0 1px 2px;white-space:nowrap;gap:2px}
.kl span{overflow:visible}
.ls{color:var(--sh)}.la{color:var(--al);margin-left:auto}
.kl sup,.kl sub{font-size:.75em;line-height:0}
.key{height:27px;width:100%;border:0;border-radius:8px 8px 11px 11px;background:var(--keyb);color:var(--keyt);font:600 13px/1 "Barlow Semi Condensed",sans-serif;cursor:pointer;touch-action:manipulation;
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 -2px 0 rgba(0,0,0,.45) inset,0 2px 3px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:1px;padding:0 2px;white-space:nowrap}
.key sup{font-size:.68em;line-height:0;position:relative;top:-.1em}.key sub{font-size:.68em;line-height:0}
.kfr{display:inline-flex;flex-direction:column;align-items:center;gap:1px}.kfr i{display:block;width:9px;height:6px;border:1.4px solid currentColor;border-radius:1px}.kfr b{display:block;width:13px;height:1.6px;background:currentColor}
.key:active,.pk:active{transform:translateY(1px);filter:brightness(.82);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 1px 1px rgba(0,0,0,.4)}
.key:focus-visible,.pk:focus-visible{outline:2px solid var(--sh);outline-offset:1px}
.f5 .key{height:38px;font-size:19px;background:var(--numb);color:var(--numt);border-radius:9px 9px 13px 13px}
.f5 .key.dl{background:var(--dlb);color:#fff;font-size:15px}
.cg .f5 .key.dl{background:#3a4352;color:#fff}
.f5 .key[data-k=mul],.f5 .key[data-k=div],.f5 .key[data-k=add],.f5 .key[data-k=sub],.f5 .key[data-k=eq],.f5 .key[data-k=exp],.f5 .key[data-k=ans],.f5 .key[data-k=neg]{font-size:17px}
.f5 .key[data-k=exp],.f5 .key[data-k=ans],.f5 .key[data-k=neg]{font-size:13px}
.cg .f5 .key[data-k=exp],.cg .f5 .key[data-k=neg]{background:#d9dbde}
.key.exe{background:#2563c9!important;color:#fff!important;font-size:14px!important}
.key small{font-size:.6em}
.key.sh{background:#c98a2c;color:#1a1206}.key.al{background:#b9485a;color:#fff}
.cg .key.sh{background:#d6a53a}
.key.sm{font-size:11px}
.key.fk{height:22px;background:#e9ebee;color:#222;font-size:11px;border-radius:5px 5px 9px 9px}
.padcell{display:flex;align-items:center;justify-content:center}
.pad{width:104px;height:66px;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 35%,#3f444d,#1c1f24 70%);box-shadow:0 2px 4px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.12) inset}
.cgpad{width:112px;height:72px}
.pk{position:absolute;border:0;background:transparent;color:#cfd3da;font-size:9px;cursor:pointer;touch-action:manipulation;border-radius:8px}
.pk.up{left:30%;right:30%;top:0;height:34%}.pk.dn{left:30%;right:30%;bottom:0;height:34%}
.pk.lf{left:0;top:25%;bottom:25%;width:32%}.pk.rt2{right:0;top:25%;bottom:25%;width:32%}
.pcap{position:absolute;inset:0;display:grid;place-items:center;font:600 7px "Barlow Semi Condensed",system-ui,sans-serif;color:#8a909a;pointer-events:none;letter-spacing:.04em}
.cg .pcap{display:none}
.hint2{position:fixed;left:0;right:0;bottom:calc(2px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:var(--mute);pointer-events:none;transition:opacity .6s}

</style>
</head>
<body>
<nav class="nav" aria-label="Calculator models">
  <button data-i="0" class="on">Two-line</button>
  <button data-i="1">Natural</button>
  <button data-i="2">Graphing</button>
</nav>
<main class="track" id="track">
  <section class="slide" id="two-line"><div class="scaler"><div id="c0"></div></div></section>
  <section class="slide" id="natural"><div class="scaler"><div id="c1"></div></div></section>
  <section class="slide" id="graphing"><div class="scaler"><div id="c2"></div></div></section>
</main>
<div class="hint2" id="hint">Swipe left or right to change model</div>
<script>
// ================= ENGINE (shared by all three models) =================
class CalcErr extends Error{constructor(k){super(k);this.kind=k;}}
const err=k=>{throw new CalcErr(k)};
const FN1=new Set(['sin','cos','tan','asin','acos','atan','sinh','cosh','tanh','asinh','acosh','atanh','log','ln','sqrt','cbrt','exp10','expe','abs','int','intg','rnd','not','neg']);
const FNM=new Set(['pol','rec','logab','integ','diff','sum','ranint','root','gcd','lcm']);
const SYM=new Set(['ran','xbar','sx','ox','nn','sumx','sumx2','ybar','sy','oy','sumy','sumy2','sumxy','ra','rb','rr','minx','maxx','miny','maxy']);
const BINW=new Set(['and','or','xor','xnor']);

function tokenize(src,base){
  const T=[];let i=0;const n=src.length;
  while(i<n){
    const c=src[i];
    if(c===' '){i++;continue;}
    if(base&&base!==10&&/[0-9A-F]/.test(c)){
      let j=i;while(j<n&&/[0-9A-F]/.test(src[j]))j++;
      const s=src.slice(i,j);
      for(const ch of s) if(parseInt(ch,16)>=base) err('Syntax');
      T.push({t:'num',v:parseInt(s,base),dot:false});i=j;continue;
    }
    if(/[0-9.]/.test(c)||c==='ᴇ'){
      let j=i;while(j<n&&/[0-9.]/.test(src[j]))j++;
      const m=src.slice(i,j);
      if((m.match(/\./g)||[]).length>1||m==='.')err('Syntax');
      let v=m===''?1:parseFloat(m);
      if(src[j]==='ᴇ'){
        j++;let k=j;if(src[k]==='-'||src[k]==='~')k++;
        let k2=k;while(k2<n&&/[0-9]/.test(src[k2]))k2++;
        if(k2===k)err('Syntax');
        v=parseFloat((m===''?'1':m)+'e'+(src[j]==='-'||src[j]==='~'?'-':'')+src.slice(k,k2));j=k2;
      } else if(m==='')err('Syntax');
      T.push({t:'num',v,dot:m.includes('.')});i=j;continue;
    }
    if(/[a-z_]/.test(c)){
      let j=i;while(j<n&&/[a-z0-9_]/.test(src[j]))j++;
      const w=src.slice(i,j);i=j;
      if(FN1.has(w))T.push({t:'fn',v:w});
      else if(FNM.has(w))T.push({t:'fnm',v:w});
      else if(SYM.has(w))T.push({t:'sym',v:w});
      else if(BINW.has(w))T.push({t:'op',v:w});
      else err('Syntax');
      continue;
    }
    if(/[A-Zθ]/.test(c)){T.push({t:'var',v:c});i++;continue;}
    T.push({t:'op',v:c});i++;
  }
  return T;
}

const tr=(x,e)=>e.angle==='R'?x:e.angle==='G'?x*Math.PI/200:x*Math.PI/180;
const itr=(x,e)=>e.angle==='R'?x:e.angle==='G'?x*200/Math.PI:x*180/Math.PI;
function trig(f,x,e){

function statCalc(data,type){
  const n=data.reduce((s,d)=>s+(d.f??1),0);
  const S={n,type};
  let sx=0,sx2=0,sy=0,sy2=0,sxy=0,minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
  for(const d of data){const f=d.f??1;sx+=f*d.x;sx2+=f*d.x*d.x;minx=Math.min(minx,d.x);maxx=Math.max(maxx,d.x);

  S.xbar=sx/n;S.ybar=sy/n;

  S.sx=n>1?Math.sqrt(Math.max(0,(sx2-n*S.xbar*S.xbar)/(n-1))):NaN;
  S.oy=Math.sqrt(Math.max(0,sy2/n-S.ybar*S.ybar));
  S.sy=n>1?Math.sqrt(Math.max(0,(sy2-n*S.ybar*S.ybar)/(n-1))):NaN;

    const tx=['log','pwr'].includes(type)?(x=>{if(x<=0)err('Math');return Math.log(x)}):type==='inv'?(x=>{if(x===0)err('Math');return 1/x}):(x=>x);

    let X=0,Y=0,XX=0,YY=0,XY=0;
    for(const d of data){const f=d.f??1,a=tx(d.x),b=ty(d.y);X+=f*a;Y+=f*b;XX+=f*a*a;YY+=f*b*b;XY+=f*a*b;}

function clean(v){

}
function run(src,env,opt={}){
  const{f,F}=compile(src,opt);

}
// split at top-level char (outside parentheses)
function splitTop(src,ch){
  let d=0;const out=[];let cur='';
  for(const c of src){if(c==='(')d++;else if(c===')')d--;if(c===ch&&d===0){out.push(cur);cur=''}else cur+=c}

}

// ---- number formatting ----
function fmt(v,S){
  if(v===0)return{m:'0',e:null};
  const a=Math.abs(v);
  if(S.disp==='fix'&&a<1e10){
    const s=v.toFixed(S.n);
    if(+s!==0||a>=Math.pow(10,-S.n))return{m:s,e:null};
  }
  if(S.disp==='sci'){
    const[m,e]=v.toExponential((S.n||10)-1).split('e');return{m,e:+e};
  }
  if(S.disp==='fix'){const[m,e]=v.toExponential(9).split('e');return{m:m.replace(/\.?0+$/,''),e:+e}}
  const r=+v.toPrecision(10),ar=Math.abs(r);
  const lo=S.norm===2?1e-9:1e-2;
  if(ar>=1e10||ar<lo){let[m,e]=r.toExponential(9).split('e');m=m.replace(/\.?0+$/,'');if(m.includes('.')===false&&false)m+='';return{m,e:+e}}
  const ex=Math.floor(Math.log10(ar));
  let s=r.toFixed(Math.min(20,Math.max(0,9-ex)));
  if(s.includes('.'))s=s.replace(/\.?0+$/,'');
  return{m:s,e:null};
}
function fmtEng(v,e3){
  const m=v/Math.pow(10,e3);
  let s=(+m.toPrecision(10)).toString();
  if(s.includes('e'))s=(+m.toPrecision(10)).toFixed(0);
  return{m:s,e:e3};
}
function engBase(v){if(v===0)return 0;return 3*Math.floor(Math.floor(Math.log10(Math.abs(+v.toPrecision(10))))/3)}
function fmtStr(v,S){const r=fmt(v,S);return r.e==null?r.m:r.m+'ᴇ'+r.e}

function toFrac(v,maxDen=1e4,tol=1e-10){

    if(Math.abs(x-h1/k1)<=tol*Math.max(1,x))return{n:s*h1,d:k1};
    const f=y-a;if(f<1e-14)break;y=1/f;
  }

function solveLinear(A,b){
  const n=A.length;const M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){
    let piv=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[piv][c]))piv=r;
    if(Math.abs(M[piv][c])<1e-12)return null;
    [M[c],M[piv]]=[M[piv],M[c]];
    for(let r=0;r<n;r++)if(r!==c){const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}
  }
  return M.map((r,i)=>clean(r[n]/r[i]));

  add:(a,b)=>[a[0]+b[0],a[1]+b[1]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],
  mul:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],
  div:(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return[(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]}
};
function polyRoots(c){
  if(c[0]===0)err('Math');
  const n=c.length-1;const a=c.map(x=>x/c[0]);
  let roots;
  if(n===1)roots=[[-a[1],0]];
  else if(n===2){
    const B=a[1],C=a[2],D=B*B-4*C;
    if(D>=0){const s=Math.sqrt(D);const q=-(B+(B>=0?s:-s))/2;const r1=q,r2=q!==0?C/q:-B-q;roots=[[Math.max(r1,r2),0],[Math.min(r1,r2),0]]}
    else{const s=Math.sqrt(-D)/2;roots=[[-B/2,s],[-B/2,-s]]}
  } else {
    roots=[];let z=[0.4,0.9];for(let i=0;i<n;i++){roots.push(z);z=cx.mul(z,[0.4,0.9])}
    const P=x=>{let r=[1,0];for(let i=1;i<=n;i++)r=cx.add(cx.mul(r,x),[a[i],0]);return r};
    for(let it=0;it<2000;it++){
      let mx=0;
      for(let i=0;i<n;i++){let den=[1,0];for(let j=0;j<n;j++)if(j!==i)den=cx.mul(den,cx.sub(roots[i],roots[j]));
        const d=cx.div(P(roots[i]),den);roots[i]=cx.sub(roots[i],d);mx=Math.max(mx,Math.hypot(d[0],d[1]))}
      if(mx<1e-15)break;
    }
    roots.sort((p,q)=>Math.abs(p[1])-Math.abs(q[1])||q[0]-p[0]);
  }
  return roots.map(([re,im])=>{
    if(Math.abs(im)<1e-9*(1+Math.abs(re)))im=0;
    if(Math.abs(re)<1e-12*(1+Math.abs(im)))re=0;
    return[+re.toPrecision(12),+im.toPrecision(12)];
  });
}
function solveEq(fc,x0,e){
  const sv=e.vars.X;
  const f=x=>{e.vars.X=x;return fc(e)};
  try{
    let x=x0,best=null;
    const tryNewton=start=>{
      let x=start;
      for(let i=0;i<200;i++){
        let fx;try{fx=f(x)}catch(_){return null}
        if(!isFinite(fx))return null;
        if(Math.abs(fx)<1e-14)return x;
        const h=1e-6*Math.max(1,Math.abs(x));let d;
        try{d=(f(x+h)-f(x-h))/(2*h)}catch(_){return null}
        if(!d||!isFinite(d))return null;
        let nx=x-fx/d;
        if(Math.abs(nx-x)<1e-13*Math.max(1,Math.abs(x))){x=nx;break}
        x=nx;
      }
      try{const fx=f(x);if(isFinite(fx)&&Math.abs(fx)<1e-8*Math.max(1,Math.abs(x)))return x}catch(_){}
      return null;
    };
    best=tryNewton(x);
    if(best==null){for(const s of[1,-1,10,-10,100,-100,0.5,-0.5,1000]){best=tryNewton(x+s);if(best!=null)break}}
    if(best==null)err("Can't Solve");
    const lr=f(best);
    return{x:clean(best),lr:clean(Math.abs(lr)<1e-12?0:lr)};
  }finally{e.vars.X=sv}
}

      if(node.k==='frac'){if(dir<0&&idx===1)to=0;if(dir>0&&idx===0)to=1}

  menuKey(k,sh){

    }
    this.$l2.classList.remove('dim');
    if(this.phase==='error'){this.$l1.innerHTML=cell(this.errK+' ERROR');this.$l2.innerHTML='';return}
    // line 1
    if(this.l1Override){this.$l1.innerHTML=cell(this.l1Override)}

      const full=this.ed.disp(),pre=this.ed.dispUpTo();
      const W=13;let start=0;
      if(this.phase==='edit'){if(pre.length>=W)start=pre.length-W+1}
      const vis=full.slice(start,start+W);const curPos=pre.length-start;
      let h='';
      for(let i=0;i<W;i++){
        const c=vis[i];const isCur=this.phase==='edit'&&i===curPos;
        h+=`<b class="${isCur?(this.ed.ins?'ci':'cu'):''}">${c&&c!==' '?esc(c):'&nbsp;'}</b>`;

    if(!r.frac&&!r.dmsv&&!m.includes('.'))m+='.';
    let cells;
    if(r.dmsv)cells=strToCells(m.replace(/°/g,'┘'));else cells=strToCells(m);

  }

  if(e.metaKey||e.ctrlKey||e.altKey)return;
  let k=KM[e.key];
  if(e.key==='Enter'||e.key==='=')k=cur===2?'exe':'eq';
  if(cur===2&&e.key==='Escape')k='exit';
  if(e.key==='Tab'){e.preventDefault();go((cur+(e.shiftKey?2:1))%3,true);return}
  if(!k)return;e.preventDefault();
  const c=calcs[cur];try{c.press(k)}catch(x){console.error(x)}c.render();
});
}
</script>
